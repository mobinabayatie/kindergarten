<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>
    <img src="../pictures/blue-login-background.jpg" id="background-image">
    <div class="form-section">
        <div class="background">
        <img src="../pictures/character.png" alt="" id="character">
        </div>
        <div class="inputs">
            <label for="name" class="label name">Name</label>
            <input type="text" name="name" id="name">

            <label for="family" class="label family">Family</label>
            <input type="text" name="family" id="family"><br>

            <label for="age" class="label age">Age</label>
            <input type="number" name="age" id="age">
            
            <label for="address" class="label address">Address</label>
            <input type="text" name="address" id="address"><br>

            <p class="label gender">Gender</p>
            <label for="boy" class="label boy">Boy</label><br>
            <input type="radio" name="gender" value="boy" id="boy"><br>
            <label for="girl" class="label girl">Girl</label><br>
            <input type="radio" name="gender" value="girl" id="girl"><br>

            <label for="mnumber" class="label mnumber">Mother's Phone Number</label>
            <input type="text" name="mnumber" id="mnumber">

            <label for="fnumber" class="label fnumber">Father's Phone Number</label>
            <input type="text" name="fnumber" id="fnumber"><br>

            <label for="username" class="label username">Username</label>
            <input type="text" name="username" id="username">

            <label for="password" class="label password">Password</label>
            <input type="password" name="password" id="password"><br>

            <button type="reset" class="btn reset">Reset</button>
            <button type="submit" class="btn register">Register</button>


        </div>
        
    </div>
    
</body>
</html>
