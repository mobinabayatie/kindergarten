<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <img src="../pictures/blue-login-background.jpg" id="background-image">
    <div class="form-section">
        <div class="background">
        <img src="../pictures/character.png" alt="" id="character">
        </div>
        <div class="inputs">
            <label for="username" class="label username">Username</label>
            <input type="text" name="username" id="username"><br>

            <label for="password" class="label password">Password</label>
            <input type="password" name="password" id="password"><br>

            <a id="register-link" href="register.html">You don't have an aacount?</a><br>

            <button type="reset" class="btn reset">Reset</button><br>
            <button type="submit" class="btn login">Login</button>
        </div>
        
    </div>
    
</body>
</html>
